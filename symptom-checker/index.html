<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Symptom Checker</title>
    <link rel="stylesheet" href="/symptom-checker/styles.css">
</head>
<body>
    <header>
        <h1>AI Symptom Checker</h1>
    </header>
    <main>
        <section class="symptom-form">
            <h2>Enter Your Symptoms</h2>
            <textarea id="symptoms-input" placeholder="Describe your symptoms... (e.g. headache, fever, sore throat)"></textarea>
            <button id="check-btn">Check Symptoms</button>
        </section>
        <section class="result" id="result-section" style="display:none">
            <h2>AI Diagnosis</h2>
            <div id="diagnosis"></div>
            <div id="recommendation"></div>
            <button id="book-btn">Book Appointment</button>
        </section>
        <div id="loading" style="display:none">Analyzing symptoms...</div>
    </main>
    <footer>
        <p>&copy; 2025 AI Doctor Appointment System</p>
    </footer>
    <script src="/symptom-checker/app.js"></script>
</body>
</html>
