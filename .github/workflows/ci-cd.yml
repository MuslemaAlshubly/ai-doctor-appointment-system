name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=120 --ignore=E302,E303,W292,E501 || true

      - name: Run unit tests
        run: |
          pip install pytest
          pytest --tb=short || true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-doctor-appointment-system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-doctor-appointment-system:${{ github.sha }}

      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            --name doctor-test \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-doctor-appointment-system:latest
          sleep 5
          curl --fail http://localhost:5000/health
          docker stop doctor-test && docker rm doctor-test

  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-doctor-appointment-system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-doctor-appointment-system:${{ github.sha }}

      - name: Trigger Render deploy
        run: |
          curl --fail "${{ secrets.RENDER_DEPLOY_URL }}"


       